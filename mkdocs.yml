site_name: Pulse
site_description: A reactive library for Roblox
site_author: Mystifine
site_url: https://mystifine.github.io/Pulse/
repo_url: https://github.com/Mystifine/Pulse
repo_name: Mystifine/Pulse
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    scheme: slate
    primary: purple
    accent: purple
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.annotate
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Basic Concepts: getting-started/basic-concepts.md
    - Quick Start: getting-started/quickstart.md
  - API Reference:
    - Value: api/value.md
    - Computed: api/computed.md
    - Effect: api/effect.md
    - Scope: api/scope.md
    - Spring: api/spring.md
    - Tween: api/tween.md
    - Create: api/create.md
  - Examples:
    - Counter App: examples/counter.md
    - Dynamic List: examples/dynamic-list.md
    - Reactive UI: examples/reactive-ui.md
  - Contributing:
    - Contributing: contributing/contributing.md
  - About:
    - License: about/license.md
